<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能地圖 | EVkeeper</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <style>
        .controls { padding: 12px; background: rgba(15, 23, 42, 0.8); display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn { background: rgba(255, 255, 255, 0.1); color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.18); padding: 8px 16px; margin: 0 4px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .btn:hover { background: var(--primary-green); color: #000; }
        .btn.active { background: var(--primary-green); color: #000; font-weight: bold; }
        #map { height: calc(100vh - 125px); width: 100%; }
        .popup-route-btn { display: block; text-align: center; background: #27ae60; color: white; padding: 6px; margin-top: 8px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .popup-route-btn:hover { background: #219653; }
        .badge { display: inline-block; padding: 3px 6px; border-radius: 3px; font-size: 11px; color: white; font-weight: bold; margin-bottom: 5px; }
        .bg-charge { background: #e67e22; }
        .bg-recycle { background: #27ae60; }


    </style>
</head>
<body>
    <nav>
        <div class="logo">EVkeeper</div>
        <button class="nav-toggle" aria-label="開啟選單">☰</button>
        <ul class="nav-links">
            <li><a href="index.html">首頁</a></li>
            <li><a href="battery-health.html">電池健康</a></li>
            <li><a href="selling-trading.html">交易平台</a></li>

            <li><a href="map.html">智能地圖</a></li>
        </ul>
    </nav>
    <div class="controls">
        <button class="btn active" id="btn-all" onclick="filterMarkers('all')">顯示全部</button>
        <button class="btn" id="btn-charging" onclick="filterMarkers('charging')">⚡ 充電及泊車</button>
        <button class="btn" id="btn-recycle" onclick="filterMarkers('recycle')">♻️ 電池回收點</button>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // original center
        const map = L.map('map').setView([22.2988, 114.1722], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let currentMarkers = []; 
        let currentFilter = 'all';

        // database
        const allLocations = [

            },
            {

            },
            {

                details: '標準充電位 x 15<br><b>實時剩餘車位：5 個</b> (每分鐘更新)'
            }
            {

                lat: 22.2934, lng: 114.1741,
                provider: 'Tesla Supercharger / 國網 V2G',

            },
            {

                name: '美麗華廣場二期 Mira Place 2 停車場',

            },
            {

                provider: '基滙資本 / 易充站 (EVI)',
                details: '快速充電 (50kW) x 4 | 中速 (7kW) x 15<br>全港最大型市區充電樞紐之一。'
            },
            {

            },
            {

                lat: 22.3295, lng: 114.1605,
                provider: '環境保護署委託營運團體',

            }
            {

                lat: 22.3192, lng: 114.1685,

            {

            },
            {

            },
            {

            },
            {
                type: 'charging',
                name: '荃灣如心廣場 Nina Tower 停車場',
                lat: 22.3686, lng: 114.1114,
                provider: '基滙資本 / Smart Charge',
                details: '快充 (50kW) x 2 | 中充 x 14<br>新界西市中心地標充電站。'
            },
            {
                type: 'charging',
                name: '元朗 YOHO MALL 停車場',
                lat: 22.4445, lng: 114.0380,
                provider: 'Tesla & Shell Recharge',
                details: '超級充電樁 x 4 | 通用中速充電位 x 15'
            },
            {
                type: 'charging',
                name: '屯門市廣場 Tuen Mun Town Plaza 停車場',
                lat: 22.3926, lng: 113.9760,
                provider: 'Shell Recharge',
                details: '屯門核心地帶，提供最新高效率快速充電與中速充電樁。'
            },
            {
                type: 'charging',
                name: '東涌東薈城 Citygate Outlets 停車場',
                lat: 22.2894, lng: 113.9411,
                provider: '中電 CLP / 易充站',
                details: '快速充電樁 x 2 | 中速充電樁 x 8<br>往返機場或大嶼山前最佳補給站。'
            }
        ];

        // custom pin
        const iconRecycle = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        const iconCharging = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-orange.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        // marking
        function renderMarkers() {
            currentMarkers.forEach(marker => map.removeLayer(marker));
            currentMarkers = [];

            allLocations.forEach(loc => {
                if (currentFilter === 'all' || loc.type === currentFilter) {
                    const badgeClass = loc.type === 'charging' ? 'bg-charge' : 'bg-recycle';
                    const badgeText = loc.type === 'charging' ? '⚡ 充電+泊車' : '♻️ 電池回收';
                    const customIcon = loc.type === 'charging' ? iconCharging : iconRecycle;

                    // detect ipad/iphone
                    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                    let mapUrl;
                    if (isIOS) {
                        mapUrl = `https://maps.apple.com/?daddr=${loc.lat},${loc.lng}`;
                    } else {
                        mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}`;
                    }

                    const popupHTML = `
                        <span class="badge ${badgeClass}">${badgeText}</span>
                        <h3 style="margin:4px 0; font-size:16px;">${loc.name}</h3>
                        <p style="margin:2px 0; font-size:12px; color:#7f8c8d;">營運/認可機構: ${loc.provider}</p>
                        <div style="margin-top:8px; font-size:13px; line-height:1.4;">${loc.details}</div>
                        <a href="${mapUrl}" target="_blank" class="popup-route-btn">🧭 導航</a>
                    `;

                    const marker = L.marker([loc.lat, loc.lng], { icon: customIcon }).bindPopup(popupHTML);
                    marker.addTo(map);
                    currentMarkers.push(marker); 
                }
            });
        }

        // marking filter
        function filterMarkers(type) {
            currentFilter = type;
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            if(type === 'all') document.getElementById('btn-all').classList.add('active');
            if(type === 'charging') document.getElementById('btn-charging').classList.add('active');
            if(type === 'recycle') document.getElementById('btn-recycle').classList.add('active');
            renderMarkers();
        }

        // real time update function
        async function fetchLatestData() {
            console.log("正在向政府伺服器索取實時數據...");
            try {
                const response = await fetch('https://api.data.gov.hk/v1/carpark-info-vacancy');
                const govData = await response.json();
                const realHarbourCityData = govData.results.find(
                    carpark => carpark.name === '尖沙咀海港城停車場 (海運大廈)' 
                );

                if (realHarbourCityData) {
                    const myHarbourCity = allLocations.find(loc => loc.name.includes('海港城'));
                    if (myHarbourCity) {
                        const currentVacancy = realHarbourCityData.vacancy;
                        const vacancyColor = currentVacancy > 0 ? '#27ae60' : 'red';
                        myHarbourCity.details = `快充 (60kW) x 2 | 中充 (7kW) x 10<br>
                        <b style="color: ${vacancyColor}">實時剩餘車位：${currentVacancy} 個</b> (政府 API 實時同步)`;
                    }
                }
                renderMarkers();
                console.log("地圖已根據政府實時數據更新");
            } catch (error) {
                console.error("API 連線失敗，請檢查網路：", error);
            }
        }

        renderMarkers();
        // timer
        setInterval(fetchLatestData, 60000);

        // Navigation toggle
        const toggle = document.querySelector('.nav-toggle');
        const menu = document.querySelector('.nav-links');
        if (toggle && menu) {
            toggle.addEventListener('click', function () {
                menu.classList.toggle('open');
            });
        }

    </script>;
        }
</body>
</html>
